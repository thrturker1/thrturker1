name: Refresh public GitHub telemetry

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: write

concurrency:
  group: profile-stats-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh public snapshot and SVG
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python tools/generate_stats.py

      - name: Commit changed telemetry
        run: |
          if git diff --quiet -- assets/github-stats.svg tools/data/github-snapshot.json; then
            echo "Telemetry is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-stats.svg tools/data/github-snapshot.json
          git commit -m "chore: refresh public GitHub telemetry"
          git push
