name: Verify generated profile assets

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "README.md"
      - "PROFILE-STATIC.md"
      - "assets/**"
      - "tools/**"
      - "requirements.txt"
      - ".github/workflows/**"
  push:
    branches: [main, master]
    paths:
      - "README.md"
      - "PROFILE-STATIC.md"
      - "assets/**"
      - "tools/**"
      - "requirements.txt"
      - ".github/workflows/**"

permissions:
  contents: read

concurrency:
  group: profile-assets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install generator dependencies
        run: python -m pip install -r requirements.txt

      - name: Regenerate and validate
        run: python tools/validate.py

      - name: Verify committed output is current
        # SVG output is platform-independent. The terminal GIF is validated above,
        # but not byte-compared because font rasterization varies by operating system.
        run: git diff --exit-code -- assets/*.svg tools/data/github-snapshot.json
