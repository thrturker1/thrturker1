      <path d="M797 69h361M818 211h319" stroke="#008CFF" opacity=".18"/>
      <path class="scanB" d="M797 36h110l70 198H867z" fill="#008CFF" opacity=".05"/>
      <text x="819" y="61" fill="#7299B4" font-family="Consolas,DejaVu Sans Mono,monospace" font-size="10" font-weight="400" letter-spacing="1.8" text-anchor="start">PROJECT 02</text>
      <text x="819" y="112" fill="#D8F4FF" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" letter-spacing="1.1" text-anchor="start">GOBLET</text>
      <circle class="signal" cx="823" cy="148" r="4" fill="#FFC85C"/>
      <text x="836" y="153" fill="#FFC85C" font-family="Consolas,DejaVu Sans Mono,monospace" font-size="11" font-weight="700" letter-spacing="1.3" text-anchor="start">IN DEVELOPMENT</text>
      <text x="819" y="184" fill="#7299B4" font-family="Consolas,DejaVu Sans Mono,monospace" font-size="10" font-weight="400" letter-spacing="0.6" text-anchor="start">GAME PROJECT  /  IN DEVELOPMENT</text>
      <path d="M1086 91h37c0 22-7 34-18 38v13h14m-46 0h46m-33-51c0 22 7 34 19 38" fill="none" stroke="#A9EAFF" stroke-width="2" opacity=".8"/>
    </g>
    <text x="1158" y="258" fill="#A9EAFF" font-family="Consolas,DejaVu Sans Mono,monospace" font-size="11" font-weight="400" letter-spacing="0.5" text-anchor="end">addictitygames.com  ↗</text>
