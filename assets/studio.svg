      <text x="447" y="112" fill="#D8F4FF" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" letter-spacing="1.1" text-anchor="start">NO RESPITE</text>
      <circle class="signal" cx="451" cy="148" r="4" fill="#FFC85C"/>
      <text x="464" y="153" fill="#FFC85C" font-family="Consolas,DejaVu Sans Mono,monospace" font-size="11" font-weight="700" letter-spacing="1.3" text-anchor="start">IN DEVELOPMENT</text>
      <text x="447" y="184" fill="#7299B4" font-family="Consolas,DejaVu Sans Mono,monospace" font-size="10" font-weight="400" letter-spacing="0.6" text-anchor="start">SURVIVAL  /  ENDLESS WAVE  /  ACTION</text>
      <path d="M710 89l20 20-20 20-20-20zM710 98v22m-11-11h22" fill="none" stroke="#55C8FF" opacity=".75"/>
    </g>
    <g>
