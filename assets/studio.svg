<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img">
<title>Studio</title>
<desc>Cyber-terminal control room interface for Tahir.</desc>

<defs>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="4" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="2" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
    <path d="M0 3.5H4" stroke="#55C8FF" stroke-opacity=".035"/>
  </pattern>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M40 0H0V40" fill="none" stroke="#55C8FF" stroke-opacity=".045"/>
  </pattern>
</defs>
<rect width="1200" height="420" rx="18" fill="#02060B"/>
<rect x="1" y="1" width="1198" height="418" rx="17" fill="none" stroke="#55C8FF" stroke-opacity=".34"/>
<path d="M22 1h92l12 12h150M1178 1h-74l-12 12h-102" fill="none" stroke="#55C8FF" stroke-opacity=".6"/>
<rect width="1200" height="420" rx="18" fill="url(#grid)"/>
<rect width="1200" height="420" rx="18" fill="url(#scan)"/>
<text x="24" y="30" fill="#7299B4" font-family="ui-monospace,Consolas,monospace" font-size="11" letter-spacing="2">CR://STUDIO_LINK / ADDICTITY_GAMES</text>
<circle cx="1170" cy="25" r="4" fill="#65F7B2"/>

<style>.wave{animation:wave 5s ease-in-out infinite} @keyframes wave{50%{transform:translateX(22px)}} @media(prefers-reduced-motion:reduce){*{animation:none!important}}</style>

<text x="32" y="68" fill="#55C8FF" font-family="ui-monospace,Consolas,monospace" font-size="12" letter-spacing="3">04 // INDEPENDENT GAME STUDIO</text>
<g transform="translate(58 112)">
  <circle cx="84" cy="96" r="74" fill="none" stroke="#55C8FF" stroke-opacity=".22"/>
  <circle cx="84" cy="96" r="49" fill="#07111C" stroke="#008CFF" stroke-opacity=".7"/>
  <path d="M58 112c18-42 39-42 54 0M67 80h34M72 65l12-18 12 18" fill="none" stroke="#55C8FF" stroke-width="4"/>
  <path class="wave" d="M-20 96h38l12-18 16 36 14-20 18 2" fill="none" stroke="#A9EAFF" stroke-opacity=".65"/>
</g>
<text x="248" y="148" fill="#D8F4FF" fill-opacity="1" text-anchor="start" font-family="ui-monospace,Consolas,monospace" font-size="43" font-weight="700" letter-spacing="4">ADDICTITY</text>
<text x="551" y="148" fill="#7299B4" fill-opacity="1" text-anchor="start" font-family="ui-monospace,Consolas,monospace" font-size="43" font-weight="700" letter-spacing="4">GAMES</text>
<text x="250" y="184" fill="#55C8FF" fill-opacity="1" text-anchor="start" font-family="ui-monospace,Consolas,monospace" font-size="14" font-weight="400" letter-spacing="1.5">STRONG MECHANICS. REPLAYABILITY. IDENTITY.</text>
<text x="250" y="218" fill="#D8F4FF" fill-opacity="1" text-anchor="start" font-family="ui-monospace,Consolas,monospace" font-size="15" font-weight="400" letter-spacing="0">Focused games built around strong gameplay loops,</text>
<text x="250" y="242" fill="#D8F4FF" fill-opacity="1" text-anchor="start" font-family="ui-monospace,Consolas,monospace" font-size="15" font-weight="400" letter-spacing="0">replayability, and the feeling of one more run.</text>
<rect x="250" y="258" width="512" height="70" rx="8" fill="#07111C" stroke="#55C8FF" stroke-opacity=".32"/>
<circle cx="276" cy="280" r="4" fill="#FFC857"/>
<text x="294" y="285" fill="#FFC857" fill-opacity="1" text-anchor="start" font-family="ui-monospace,Consolas,monospace" font-size="10" font-weight="400" letter-spacing="1.5">IN DEVELOPMENT</text>
<text x="276" y="311" fill="#D8F4FF" fill-opacity="1" text-anchor="start" font-family="ui-monospace,Consolas,monospace" font-size="13" font-weight="400" letter-spacing="0.7">NO RESPITE  //  SURVIVAL • ENDLESS WAVE • ACTION</text>
<path d="M830 112h310v216H830z" fill="#07111C" stroke="#008CFF" stroke-opacity=".25"/>
<path d="M856 293l57-64 43 35 72-98 86 127" fill="none" stroke="#008CFF" stroke-opacity=".42" stroke-width="2"/>
<path d="M856 293h258M856 265h258M856 237h258M856 209h258M856 181h258" stroke="#55C8FF" stroke-opacity=".08"/>
<text x="856" y="150" fill="#7299B4" fill-opacity="1" text-anchor="start" font-family="ui-monospace,Consolas,monospace" font-size="11" font-weight="400" letter-spacing="2">STUDIO UPLINK</text>
<text x="856" y="190" fill="#A9EAFF" fill-opacity="1" text-anchor="start" font-family="ui-monospace,Consolas,monospace" font-size="17" font-weight="400" letter-spacing="0">addictitygames.com</text>
<text x="856" y="320" fill="#55C8FF" fill-opacity="1" text-anchor="start" font-family="ui-monospace,Consolas,monospace" font-size="11" font-weight="400" letter-spacing="1.4">OPEN CHANNEL ↗</text>
<text x="32" y="394" fill="#7299B4" fill-opacity="1" text-anchor="start" font-family="ui-monospace,Consolas,monospace" font-size="10" font-weight="400" letter-spacing="1">PUBLIC STUDIO SIGNAL • VERIFIED 2026-10-11</text>

</svg>
