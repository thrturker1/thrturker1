<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="350" viewBox="0 0 1200 350" role="img">
<title>Agent Network</title>
<desc>Cyber-terminal control room interface for Tahir.</desc>

<defs>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="4" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="2" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
    <path d="M0 3.5H4" stroke="#55C8FF" stroke-opacity=".035"/>
  </pattern>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M40 0H0V40" fill="none" stroke="#55C8FF" stroke-opacity=".045"/>
  </pattern>
</defs>
<rect width="1200" height="350" rx="18" fill="#02060B"/>
<rect x="1" y="1" width="1198" height="348" rx="17" fill="none" stroke="#55C8FF" stroke-opacity=".34"/>
<path d="M22 1h92l12 12h150M1178 1h-74l-12 12h-102" fill="none" stroke="#55C8FF" stroke-opacity=".6"/>
<rect width="1200" height="350" rx="18" fill="url(#grid)"/>
<rect width="1200" height="350" rx="18" fill="url(#scan)"/>
<text x="24" y="30" fill="#7299B4" font-family="ui-monospace,Consolas,monospace" font-size="11" letter-spacing="2">CR://AGENT_FABRIC / ABSTRACT_PIPELINE</text>
<circle cx="1170" cy="25" r="4" fill="#65F7B2"/>

<style>
 .packet{animation:hop 4s ease-in-out infinite} .p1{animation-delay:.8s} .p2{animation-delay:1.6s} .p3{animation-delay:2.4s}
 @keyframes hop{0%,15%,100%{transform:translateX(0);opacity:0}25%{opacity:1}70%{transform:translateX(118px);opacity:1}80%{opacity:0}}
 @media(prefers-reduced-motion:reduce){*{animation:none!important}.packet{display:none}}
</style>

<text x="32" y="68" fill="#55C8FF" font-family="ui-monospace,Consolas,monospace" font-size="12" letter-spacing="3">05 // AI + AGENT ENGINEERING</text>
<text x="32" y="94" fill="#7299B4" fill-opacity="1" text-anchor="start" font-family="ui-monospace,Consolas,monospace" font-size="11" font-weight="400" letter-spacing="0.8">LLM APPLICATIONS • TOOL ORCHESTRATION • WORKFLOW AUTOMATION • MODEL EXPERIMENTATION</text>
<circle cx="92" cy="192" r="46" fill="#07111C" stroke="#55C8FF" stroke-opacity=".68"/><circle cx="92" cy="192" r="30" fill="none" stroke="#55C8FF" stroke-opacity=".12" stroke-dasharray="3 5"/><text x="92" y="198" fill="#D8F4FF" fill-opacity="1" text-anchor="middle" font-family="ui-monospace,Consolas,monospace" font-size="12" font-weight="700" letter-spacing="1">INPUT</text><text x="92" y="257" fill="#7299B4" fill-opacity="1" text-anchor="middle" font-family="ui-monospace,Consolas,monospace" font-size="9" font-weight="400" letter-spacing="1">NODE 01</text><path d="M138 192H270" stroke="#55C8FF" stroke-opacity=".25" stroke-dasharray="4 7"/><circle class="packet p0" cx="156" cy="192" r="4" fill="#A9EAFF" filter="url(#softGlow)"/><circle cx="316" cy="192" r="46" fill="#07111C" stroke="#008CFF" stroke-opacity=".68"/><circle cx="316" cy="192" r="30" fill="none" stroke="#55C8FF" stroke-opacity=".12" stroke-dasharray="3 5"/><text x="316" y="198" fill="#D8F4FF" fill-opacity="1" text-anchor="middle" font-family="ui-monospace,Consolas,monospace" font-size="12" font-weight="700" letter-spacing="1">REASON</text><text x="316" y="257" fill="#7299B4" fill-opacity="1" text-anchor="middle" font-family="ui-monospace,Consolas,monospace" font-size="9" font-weight="400" letter-spacing="1">NODE 02</text><path d="M362 192H502" stroke="#55C8FF" stroke-opacity=".25" stroke-dasharray="4 7"/><circle class="packet p1" cx="380" cy="192" r="4" fill="#A9EAFF" filter="url(#softGlow)"/><circle cx="548" cy="192" r="46" fill="#07111C" stroke="#55C8FF" stroke-opacity=".68"/><circle cx="548" cy="192" r="30" fill="none" stroke="#55C8FF" stroke-opacity=".12" stroke-dasharray="3 5"/><text x="548" y="198" fill="#D8F4FF" fill-opacity="1" text-anchor="middle" font-family="ui-monospace,Consolas,monospace" font-size="12" font-weight="700" letter-spacing="1">TOOLS</text><text x="548" y="257" fill="#7299B4" fill-opacity="1" text-anchor="middle" font-family="ui-monospace,Consolas,monospace" font-size="9" font-weight="400" letter-spacing="1">NODE 03</text><path d="M594 192H734" stroke="#55C8FF" stroke-opacity=".25" stroke-dasharray="4 7"/><circle class="packet p2" cx="612" cy="192" r="4" fill="#A9EAFF" filter="url(#softGlow)"/><circle cx="780" cy="192" r="46" fill="#07111C" stroke="#008CFF" stroke-opacity=".68"/><circle cx="780" cy="192" r="30" fill="none" stroke="#55C8FF" stroke-opacity=".12" stroke-dasharray="3 5"/><text x="780" y="198" fill="#D8F4FF" fill-opacity="1" text-anchor="middle" font-family="ui-monospace,Consolas,monospace" font-size="12" font-weight="700" letter-spacing="1">ACTION</text><text x="780" y="257" fill="#7299B4" fill-opacity="1" text-anchor="middle" font-family="ui-monospace,Consolas,monospace" font-size="9" font-weight="400" letter-spacing="1">NODE 04</text><path d="M826 192H958" stroke="#55C8FF" stroke-opacity=".25" stroke-dasharray="4 7"/><circle class="packet p3" cx="844" cy="192" r="4" fill="#A9EAFF" filter="url(#softGlow)"/><circle cx="1004" cy="192" r="46" fill="#07111C" stroke="#55C8FF" stroke-opacity=".68"/><circle cx="1004" cy="192" r="30" fill="none" stroke="#55C8FF" stroke-opacity=".12" stroke-dasharray="3 5"/><text x="1004" y="198" fill="#D8F4FF" fill-opacity="1" text-anchor="middle" font-family="ui-monospace,Consolas,monospace" font-size="12" font-weight="700" letter-spacing="1">OUTPUT</text><text x="1004" y="257" fill="#7299B4" fill-opacity="1" text-anchor="middle" font-family="ui-monospace,Consolas,monospace" font-size="9" font-weight="400" letter-spacing="1">NODE 05</text>
<rect x="210" y="295" width="780" height="34" rx="5" fill="#07111C" stroke="#55C8FF" stroke-opacity=".25"/>
<text x="600" y="317" fill="#7299B4" fill-opacity="1" text-anchor="middle" font-family="ui-monospace,Consolas,monospace" font-size="10" font-weight="400" letter-spacing="0.7">A CONCEPTUAL CONTROL FLOW — NOT A CLAIM ABOUT A PROPRIETARY IMPLEMENTATION</text>

</svg>
