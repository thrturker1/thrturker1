<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="266" viewBox="0 0 1200 266" role="img" aria-labelledby="title desc"><title id="title">Addictity Games — enter the studio</title><desc id="desc">Independent game studio. Strong mechanics. Replayability. Identity. An original animated dimensional gateway; click to visit addictitygames.com.</desc><defs>
