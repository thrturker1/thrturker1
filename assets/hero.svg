<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img">
<title>Hero</title>
<desc>Cyber-terminal control room interface for Tahir.</desc>

<defs>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="4" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="2" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
    <path d="M0 3.5H4" stroke="#55C8FF" stroke-opacity=".035"/>
  </pattern>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M40 0H0V40" fill="none" stroke="#55C8FF" stroke-opacity=".045"/>
  </pattern>
</defs>
<rect width="1200" height="430" rx="18" fill="#02060B"/>
<rect x="1" y="1" width="1198" height="428" rx="17" fill="none" stroke="#55C8FF" stroke-opacity=".34"/>
<path d="M22 1h92l12 12h150M1178 1h-74l-12 12h-102" fill="none" stroke="#55C8FF" stroke-opacity=".6"/>
<rect width="1200" height="430" rx="18" fill="url(#grid)"/>
<rect width="1200" height="430" rx="18" fill="url(#scan)"/>
<text x="24" y="30" fill="#7299B4" font-family="ui-monospace,Consolas,monospace" font-size="11" letter-spacing="2">CR://IDENTITY_HANDSHAKE / NODE-TR49</text>
<circle cx="1170" cy="25" r="4" fill="#65F7B2"/>

<style>
  .scanline{animation:sweep 7s ease-in-out infinite} .pulse{animation:pulse 2.8s ease-in-out infinite}
  .scramble{animation:glitch 7s steps(1,end) infinite} .s2{animation-delay:.12s} .s3{animation-delay:.24s}
  .noise{animation:noise 3.7s steps(1,end) infinite} .n1{animation-duration:4.3s} .n2{animation-duration:5.1s} .n3{animation-duration:6.2s}
  .packet{animation:packet 5s linear infinite} .packet.b{animation-delay:2.1s}
  @keyframes sweep{0%,8%{transform:translateX(-1260px);opacity:0}12%{opacity:.8}31%{transform:translateX(1260px);opacity:.15}32%,100%{opacity:0}}
  @keyframes glitch{0%,8%{opacity:0}9%,12%{opacity:.72}13%,15%{opacity:.12}16%,18%{opacity:.5}19%,100%{opacity:0}}
  @keyframes noise{0%,11%,16%,100%{opacity:0}12%,15%{opacity:1}}
  @keyframes pulse{0%,100%{opacity:.36}50%{opacity:1}}
  @keyframes packet{0%{stroke-dashoffset:280}100%{stroke-dashoffset:-280}}
  @media(prefers-reduced-motion:reduce){*{animation:none!important}.scramble,.noise,.scanline{display:none}}
</style>
